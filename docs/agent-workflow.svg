  <rect x="22" y="224" width="936" height="1062" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="7,4"/>
  <text x="52" y="248" font-size="12" font-weight="700" fill="#2563EB">📊  LangGraph StateGraph Orchestrator</text>

