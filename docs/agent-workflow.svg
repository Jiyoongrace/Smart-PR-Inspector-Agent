  <rect x="290" y="400" width="400" height="72" rx="10" fill="#7C3AED" filter="url(#sh)"/>
  <text x="490" y="420" text-anchor="middle" font-size="10" fill="#DDD6FE" letter-spacing="1.2">NODE 2  ·  convention_check_node</text>
  <text x="490" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="white">🔍  convention</text>
