  <line x1="490" y1="666" x2="490" y2="690" stroke="#475569" stroke-width="1.8"/>
  <line x1="175" y1="690" x2="805" y2="690" stroke="#475569" stroke-width="1.8"/>

  <!-- RETRY branch right -->
  <line x1="805" y1="690" x2="805" y2="712" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <!-- retry label -->
  <rect x="742" y="694" width="72" height="20" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="778" y="708" text-anchor="middle" font-size="10" font-weight="600" fill="#991B1B">🔁 retry</text>

  <!-- SUCCESS / FAIL center -->
  <line x1="490" y1="690" x2="490" y2="712" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
