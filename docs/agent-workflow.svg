  <text x="490" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="white">⚡  FastAPI Webhook Server  ·  :8000</text>

  <!-- Arrow -->
  <line x1="490" y1="200" x2="490" y2="222" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

