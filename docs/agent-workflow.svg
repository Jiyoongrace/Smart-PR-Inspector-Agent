<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1380" viewBox="0 0 980 1380" font-family="'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif">
