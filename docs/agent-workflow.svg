  <rect x="290" y="494" width="400" height="72" rx="10" fill="#5B21B6" filter="url(#sh)"/>
  <text x="490" y="514" text-anchor="middle" font-size="10" fill="#DDD6FE" letter-spacing="1.2">NODE 3  ·  test_generator_node</text>
  <text x="490" y="536" text-anchor="middle" font-size="15" font-weight="700" fill="white">🧪  test_gen</text>
  <text x="490" y="554" text-anchor="middle" font-size="10" fill="#DDD6FE">변경 함수 시그니처 추출 → LLM이 pytest 코드 자동 생성</text>
