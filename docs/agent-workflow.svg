  <!-- ═══════════ BACKGROUND ═══════════ -->
  <rect width="980" height="1380" fill="#F0F4F8"/>

  <!-- ═══════════ TITLE ═══════════ -->
  <text x="490" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Smart PR Inspector Agent — 워크플로우 아키텍처</text>
  <text x="490" y="56" text-anchor="middle" font-size="12" fill="#64748B">LangGraph StateGraph · 순차 + 조건부 분기 패턴 · Anthropic Claude claude-sonnet-4-6</text>

  <!-- ═══════════ GITHUB TRIGGER ═══════════ -->
  <rect x="285" y="72" width="410" height="52" rx="10" fill="#1E293B" filter="url(#sh)"/>
