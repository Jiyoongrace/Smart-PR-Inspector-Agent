  <text x="490" y="380" text-anchor="middle" font-size="10" fill="#93C5FD">unidiff · GitHub REST API · AgentState 초기화</text>

  <!-- Arrow -->
  <line x1="490" y1="378" x2="490" y2="398" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

