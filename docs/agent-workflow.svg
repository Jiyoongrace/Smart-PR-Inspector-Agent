  <rect x="270" y="588" width="440" height="78" rx="10" fill="#C2410C" filter="url(#sh)"/>
  <text x="490" y="608" text-anchor="middle" font-size="10" fill="#FED7AA" letter-spacing="1.2">CONDITIONAL NODE 4  ·  test_runner_node</text>
  <text x="490" y="630" text-anchor="middle" font-size="15" font-weight="700" fill="white">🏃  test_run</text>
  <text x="490" y="648" text-anchor="middle" font-size="10" fill="#FED7AA">Docker 격리 환경 · pytest --tb=short · timeout=5min</text>
  <text x="490" y="662" text-anchor="middle" font-size="10" fill="#FDBA74" font-style="italic">→ should_retry(state) : retry | success | fail</text>

